<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Triple Triad</title>
    <link rel="icon" type="image/gif" href="../img/crystal-spinning.gif">
    <link rel="stylesheet" href="../css/perfil.css">
    <script type="module" src="../js/perfil.js" defer></script>
</head>

<body>
    <div class="contenedor-perfil">
        <!-- El título clásico con tu cromo giratorio -->
        <header>Perf<span class="i-animada">ı</span>l</header>
        
        <form id="formularioPerfil">
            <fieldset class="cuadro-ff7 filas">
                <!-- Se actualizará dinámicamente con el nombre del usuario -->
                <legend id="legendUsername">Cargando...</legend>

                <div class="cuerpo-formulario-rpg">
                    
                    <!-- Sección Izquierda: Marco del Avatar de Carta -->
                    <div class="seccion-avatar-interna">
                        <div class="marco-avatar" id="selectorAvatar" title="Haz clic para abrir la galería">
                            <img id="imagenAvatar" src="../img/cartas_triple_triad/card_1.png" alt="Avatar del jugador">
                            <div class="indicador-cambio">CAMBIAR</div>
                        </div>
                    </div>

                    <!-- Sección Derecha: Campos de entrada controlados -->
                    <div class="seccion-inputs-interna">
                        <div class="campo-formulario">
                            <label for="perfilNombre">Nombre: </label>
                            <input type="text" id="perfilNombre" name="nombre" autocomplete="off" required>
                        </div>

                        <div class="campo-formulario">
                            <label for="oldpassw">Pass Antigua: </label>
                            <input type="password" id="oldpassw" name="oldpassw" required>
                        </div>

                        <div class="campo-formulario">
                            <label for="newpassw">Pass Nueva: </label>
                            <input type="password" id="newpassw" name="newpassw">
                        </div>

                        <div class="campo-formulario">
                            <label for="confnewpassw">Confirmar: </label>
                            <input type="password" id="confnewpassw" name="confnewpassw">
                        </div>
                    </div>

                </div>

                <!-- Bloque de Botones Inferiores Unificados (Alineados horizontalmente a la derecha) -->
                <div class="contenedor-botones-formulario">
                    <button type="button" id="btnVolverIndex" class="boton btn-secundario">Volver</button>
                    <button type="button" id="btnLogoff" class="boton btn-secundario" style="border-color: #ff006e !important; color: #ff006e !important;">Cerrar Sesión</button>
                    <button type="button" id="btnBorrarUsuario" class="boton btn-secundario" style="border-color: #ff0000 !important; color: #ff4d4d !important;">Borrar Cuenta</button>
                    <button type="submit" class="boton">Actualizar</button>
                </div>

            </fieldset>
        </form>
    </div>

    <!-- Ventana Modal de Catálogo (Permanecerá intacta) -->
    <div id="modalAvatar" class="modal-ff7">
        <div class="contenido-modal-ff7 cuadro-ff7">
            <div class="cabecera-modal">
                <h2>Selecciona tu Avatar</h2>
                <button id="cerrarModal" class="btn-cerrar-retro">X</button>
            </div>
            <div id="rejillaAvatares" class="grid-galeria-modal"></div>
        </div>
    </div>
</body>
</html>
