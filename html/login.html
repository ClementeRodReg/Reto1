<link rel="stylesheet" href="../css/index.css" />
<div class="contenedorPadre">
    <button id="cerrarLogin" class="cerrar-modal" type="button" aria-label="Cerrar">&times;</button>
    <div class="Principal">
        <div class="contenedorLogin">
            <h2>Iniciar sesión</h2>
            <label for="usuarioLogin">Usuario:</label>
            <input type="text" id="usuarioLogin" required />
            <label for="contraseñaLogin">Contraseña:</label>
            <input type="password" id="contraseñaLogin" required />
            <button id="acceder" type="button">Iniciar sesión</button>
        </div>
        <div class="contenedorRegistro">
            <h2>Registro</h2>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" required />
            <label for="Contraseña">Contraseña:</label>
            <input type="password" id="Contraseña" required />
            <button id="Registrarse" type="button">Registrarse</button>
        </div>
    </div>
</div>
